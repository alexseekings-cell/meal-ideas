<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Meal Ideas</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: auto;
            padding: 30px;
            line-height: 1.6;
        }

        h1 {
            text-align: center;
        }

        h2 {
            margin-top: 40px;
        }

        .category {
            margin-bottom: 30px;
        }

    </style>

</head>


<body>

    <h1>🍴 Our Meal Ideas</h1>

    <div id="meal-list">
        Loading meal ideas...
    </div>


    <script>

        fetch("meals.json")

            .then(response => response.json())

            .then(meals => {

                const mealList =
                    document.getElementById("meal-list");


                for (const category in meals) {

                    const categoryDiv =
                        document.createElement("div");

                    categoryDiv.className =
                        "category";


                    const heading =
                        document.createElement("h2");

                    heading.textContent =
                        category;


                    const list =
                        document.createElement("ul");


                    meals[category].forEach(meal => {

                        const listItem =
                            document.createElement("li");

                        listItem.textContent =
                            meal;

                        list.appendChild(listItem);

                    });


                    categoryDiv.appendChild(heading);

                    categoryDiv.appendChild(list);

                    mealList.appendChild(categoryDiv);

                }

            })

            .catch(error => {

                document.getElementById("meal-list")
                    .textContent =
                    "Unable to load meal ideas.";

                console.error(error);

            });

    </script>


</body>

</html>
